<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua's Professional Journey</title>
    <link rel="stylesheet" href="path/to/your/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://img.freepik.com/free-photo/texture-with-blue-paint_1058170.htm') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            text-align: center;
        }
        header {
            position: relative;
            background-color: rgba(51, 51, 51, 0.8);
            color: #fff;
            padding: 1em 0;
        }
        header img {
            width: 100%;
            height: auto;
            max-height: 300px;
        }
        header h1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            padding: 0;
            font-size: 2em;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 0.5em;
        }
        main {
            padding: 2em;
            text-align: left;
        }
        footer {
            background-color: rgba(51, 51, 51, 0.8);
            color: #fff;
            padding: 1em 0;
            text-align: center;
        }
        .category {
            margin-bottom: 2em;
        }
        .category h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 0.5em;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://picsum.photos/1300/400?image=989" alt="Feature Image">
        <h1>Joshua's Professional Journey</h1>
    </header>
    <main>
        <div class="category">
            <h2>Conferences Attended</h2>
            <p>Details about the conferences i've attended.</p>
        </div>
        <div class="category">
            <h2>Projects Worked On</h2>
            <p>Details about the projects i've worked on.</p>
        </div>
        <div class="category">
            <h2>Workshops</h2>
            <p>Details about the workshops i've participated in.</p>
        </div>
    </main>
    <footer>
        <p>© 2024 Joshua Lamb</p>
    </footer>
</body>
</html>
