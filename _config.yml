# Site settings
title: Joshua's Professional Journey
description: A detailed account of my professional experiences, skills, and accomplishments.
baseurl: "/About-Me" # the subpath of your site
url: "https://jlamb4.github.io" # the base hostname & protocol for your site
lang: en-US
email: your-email@example.com
google_analytics: 'UA-XXXXXXXX-1'
google_analytics_anonymize_ip: true
disqus: your-disqus-username
short_name: Joshua's Journey

# Theme settings
theme: alembic-jekyll-theme

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Navigation settings
navigation_header:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Projects"
    url: "/projects/"
  - title: "Contact"
    url: "/contact/"

navigation_footer:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Projects"
    url: "/projects/"
  - title: "Contact"
    url: "/contact/"

social_links:
  - title: "Twitter"
    url: "https://twitter.com/yourusername"
  - title: "LinkedIn"
    url: "https://linkedin.com/in/yourusername"
  - title: "GitHub"
    url: "https://github.com/yourusername"

sharing_links:
  Twitter: "#1DA1F2"
  Facebook: "#3B5998"
  Pinterest: "#BD081C"
  LinkedIn: "#0077B5"
  Tumblr: "#36465D"
  Reddit: "#FF4500"
  HackerNews: "#ff6600"
  DesignerNews: "#2D72D9"
  Email: true

# Custom fonts
custom_fonts:
  urls:
    - "https://fonts.googleapis.com/css2?family=Merriweather"
  preconnect: "https://fonts.gstatic.com"

# Performance settings
service_worker: true
css_inline: false

# Date format
date_format: "%B %-d, %Y"

# SEO settings
twitter:
  username: your-twitter-username
author:
  name: Joshua
  email: your-email@example.com
social:
  name: Joshua
  links:
    - "https://twitter.com/yourusername"
    - "https://linkedin.com/in/yourusername"
    - "https://github.com/yourusername"